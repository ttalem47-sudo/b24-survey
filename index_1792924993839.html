<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحة الترشح b24</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #7fb2ff;
            --accent-2: #b8c6db;
            --bg-1: #070b14;
            --bg-2: #0f1b33;
        }
        * { box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            margin: 0;
            font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif;
            color: #fff;
            background:
                radial-gradient(circle at 15% 20%, rgba(42,82,152,.55), transparent 45%),
                radial-gradient(circle at 85% 80%, rgba(127,178,255,.25), transparent 45%),
                linear-gradient(160deg, var(--bg-1), var(--bg-2));
            background-attachment: fixed;
            overflow-x: hidden;
        }
        /* خلفية هندسية خفيفة */
        body::before {
            content: "";
            position: fixed; inset: 0;
            background-image:
                linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px);
            background-size: 48px 48px;
            mask-image: radial-gradient(circle at center, #000 30%, transparent 80%);
            -webkit-mask-image: radial-gradient(circle at center, #000 30%, transparent 80%);
            pointer-events: none;
        }
        .orb {
            position: fixed; border-radius: 50%;
            filter: blur(80px); opacity: .35; pointer-events: none;
            animation: float 12s ease-in-out infinite;
        }
        .orb.o1 { width: 320px; height: 320px; background: #2a5298; top: -80px; right: -80px; }
        .orb.o2 { width: 260px; height: 260px; background: #7fb2ff; bottom: -60px; left: -60px; animation-delay: -6s; }
        @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(30px); } }

        .page {
            position: relative; z-index: 1;
            min-height: 100vh; min-height: 100dvh;
            display: flex; align-items: center; justify-content: center;
            padding: 24px 16px;
        }
        .form-wrap {
            width: 100%; max-width: 560px;
            background: rgba(255,255,255,.07);
            border: 1px solid rgba(255,255,255,.16);
            border-radius: 28px;
            padding: 32px 28px 28px;
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            box-shadow: 0 24px 70px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.15);
            animation: rise .8s ease both;
        }
        @keyframes rise { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: none; } }

        .logo { display: block; width: 190px; max-width: 60%; margin: 0 auto 6px; filter: drop-shadow(0 6px 18px rgba(127,178,255,.35)); }
        .form-title { text-align: center; font-weight: 700; font-size: 1.5rem; margin: 6px 0 4px; }
        .form-sub { text-align: center; color: var(--accent-2); font-size: .92rem; margin-bottom: 22px; }
        .divider { height: 2px; width: 70px; margin: 0 auto 18px; border-radius: 2px; background: linear-gradient(90deg, transparent, var(--accent), transparent); }

        .field { position: relative; margin-bottom: 16px; }
        .field label { display: block; font-size: .88rem; color: var(--accent-2); margin-bottom: 6px; font-weight: 600; }
        .field .form-control {
            background: rgba(255,255,255,.08);
            border: 1px solid rgba(255,255,255,.18);
            color: #fff;
            border-radius: 14px;
            padding: 12px 16px;
            font-family: inherit;
            transition: border-color .2s, box-shadow .2s, background .2s;
        }
        .field .form-control::placeholder { color: rgba(255,255,255,.4); }
        .field .form-control:focus {
            background: rgba(255,255,255,.12);
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(127,178,255,.2);
            color: #fff;
        }
        .btn-submit {
            width: 100%;
            margin-top: 6px;
            padding: 13px;
            border: 0;
            border-radius: 14px;
            font-family: inherit; font-weight: 700; font-size: 1.05rem;
            color: #0a1226;
            background: linear-gradient(135deg, #dfe9ff, #7fb2ff);
            box-shadow: 0 10px 28px rgba(127,178,255,.35);
            transition: transform .15s, box-shadow .15s, opacity .2s;
        }
        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 14px 34px rgba(127,178,255,.5); }
        .btn-submit:active { transform: translateY(0); }
        .btn-submit:disabled { opacity: .7; transform: none; }
        #formMessage { margin-top: 14px; text-align: center; font-weight: 600; min-height: 24px; }
        .ok { color: #6ee7a8; } .err { color: #ff8a8a; }
        .foot { text-align: center; color: rgba(255,255,255,.45); font-size: .78rem; margin-top: 18px; }

        @media (max-width: 480px) {
            .form-wrap { padding: 26px 18px 22px; border-radius: 22px; }
            .logo { width: 150px; }
        }
    </style>
</head>

            <h1 class="form-title">صفحة الترشح</h1>
            <p class="form-sub">املأ بياناتك وسنتواصل معك</p>
            <div class="divider"></div>

            <form id="candidateForm">

                <div class="field">
                    <label for="name">الاسم</label>
                    <input type="text" class="form-control" id="name" name="الاسم" required placeholder="اكتب اسمك الكامل">
                </div>

                <div class="field">
                    <label for="position">الأمانة التي تريد الترشح لها</label>
                    <input type="text" class="form-control" id="position" name="الأمانة" required placeholder="مثال: الأمانة العلمية">
                </div>

                <div class="field">
                    <label for="whatsapp">رقم الواتساب</label>
                    <input type="tel" class="form-control" id="whatsapp" name="رقم الواتساب" required dir="ltr" placeholder="رقم الواتساب الخاص بك" style="text-align:right">
                </div>

                <div class="field">
                    <label for="notes">ملاحظة</label>
                    <textarea class="form-control" id="notes" name="ملاحظة" rows="3" placeholder="أي ملاحظة تريد إضافتها (اختياري)"></textarea>
                </div>

                <button type="submit" class="btn-submit" id="submitBtn">إرسال الطلب</button>
                <div id="formMessage" role="alert"></div>
            </form>

            <div class="foot">B24 © 2026</div>
        </div>
    </main>

    <script>
        // الصق هنا رابط تطبيق الويب من Google Apps Script (ينتهي بـ /exec)
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzerDyA6snShFoYLnwglpGSGvY-3E62gxNpp7MlSS1tc61OpKPeAYJRnJWebtCAB_lE/exec';

        const form = document.getElementById('candidateForm');
        const btn = document.getElementById('submitBtn');
        const msg = document.getElementById('formMessage');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!SCRIPT_URL.startsWith('https://script.google.com/')) {
                msg.className = 'err';
                msg.textContent = '❌ لم يتم ضبط رابط الجدول في الكود';
                return;
            }
            btn.disabled = true;
            btn.textContent = 'جاري الإرسال...';
            msg.className = '';
            msg.textContent = '';

            const v = (id) => document.getElementById(id).value.trim();
            const data = new URLSearchParams({
                name: v('name'),
                position: v('position'),
                whatsapp: v('whatsapp'),
                notes: v('notes')
            });

            const ctrl = new AbortController();
            const timer = setTimeout(() => ctrl.abort(), 20000);
            try {
                await fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: data, signal: ctrl.signal });
                msg.className = 'ok';
                msg.textContent = '✅ تم إرسال طلبك بنجاح';
                form.reset();
            } catch (err) {
                msg.className = 'err';
                msg.textContent = '❌ تعذّر الإرسال، تأكد من الاتصال وحاول مرة أخرى';
            } finally {
                clearTimeout(timer);
                btn.disabled = false;
                btn.textContent = 'إرسال الطلب';
            }
        });
    </script>
