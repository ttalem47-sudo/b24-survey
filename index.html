        body::after {
            content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
            background: linear-gradient(to left, rgba(51,51,51,.96) 0%, rgba(51,51,51,.9) 42%, rgba(51,51,51,0) 62%);
        }
        .page {
            min-height: 100vh; min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: flex-start; /* في RTL = اليمين */
            padding: 32px clamp(16px, 4vw, 56px);
        }
        .panel {
            width: min(520px, 100%);
            animation: rise .8s ease both;
        }
        @keyframes rise { from { opacity: 0; transform: translateY(22px); } to { opacity: 1; transform: none; } }

        .eyebrow {
            display: inline-flex; align-items: center; gap: 8px;
            font-size: .82rem; font-weight: 700; letter-spacing: .02em;
            color: var(--accent);
            margin-bottom: 10px;
        }
        .eyebrow::before { content: ""; width: 28px; height: 2px; background: var(--accent); border-radius: 2px; }
        h1 {
            margin: 0 0 12px;
            font-size: clamp(2rem, 5vw, 2.8rem);
            font-weight: 800; line-height: 1.2;
        }
        .lead { margin: 0 0 24px; color: #e6e6e6; font-size: 1.05rem; line-height: 1.9; }

        label.q { display: block; font-weight: 700; margin-bottom: 8px; }
        .field2 { margin-top: 20px; }
        .field2 textarea { min-height: 120px; }
        .sign { margin-top: 26px; text-align: center; color: var(--accent-2); font-weight: 700; letter-spacing: .02em; }
        .sign::before { content: ""; display: block; width: 46px; height: 2px; margin: 0 auto 10px; background: var(--accent); border-radius: 2px; }
        textarea, input[type=text] {
            width: 100%;
            font-family: inherit; font-size: 1rem; color: #fff;
            background: rgba(20,20,20,.55);
            border: 1.5px solid rgba(255,255,255,.38);
            border-radius: 14px;
            padding: 14px 16px;
            transition: border-color .2s, box-shadow .2s, background .2s;
        }
        textarea { min-height: 170px; resize: vertical; line-height: 1.8; }
        textarea::placeholder, input::placeholder { color: rgba(255,255,255,.58); }
        textarea:focus, input[type=text]:focus {
            outline: none; background: rgba(20,20,20,.7);
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(242,180,90,.18);
        }

        /* مفتاح إظهار الاسم */
        .name-box {
            margin-top: 18px;
            padding: 14px 16px;
            border: 1.5px solid rgba(255,255,255,.38);
            border-radius: 14px;
            background: rgba(20,20,20,.55);
        }
        .switch-row { display: flex; align-items: center; gap: 14px; cursor: pointer; }
        .switch-row input { position: absolute; opacity: 0; pointer-events: none; }
        .track {
            flex: none; width: 50px; height: 28px; border-radius: 30px;
            background: rgba(255,255,255,.35); position: relative;
            transition: background .25s;
        }
        .track::after {
            content: ""; position: absolute; top: 3px; right: 3px;
            width: 22px; height: 22px; border-radius: 50%; background: #fff;
            transition: transform .25s;
            box-shadow: 0 2px 6px rgba(0,0,0,.4);
        }
        .switch-row input:checked + .track { background: var(--accent); }
        .switch-row input:checked + .track::after { transform: translateX(-22px); }
        .switch-row input:focus-visible + .track { outline: 3px solid rgba(242,180,90,.5); outline-offset: 2px; }
        .switch-text b { display: block; font-weight: 700; }
        .switch-text small { color: #d0d0d0; font-size: .84rem; }
        .name-field {
            overflow: hidden; max-height: 0; opacity: 0;
            transition: max-height .3s ease, opacity .3s ease, margin-top .3s ease;
        }
        .name-field.open { max-height: 90px; opacity: 1; margin-top: 14px; }

        .btn-submit {
            width: 100%; margin-top: 20px; padding: 14px;
            border: 0; border-radius: 14px; cursor: pointer;
            font-family: inherit; font-weight: 800; font-size: 1.08rem;
            color: #2a1c05;
            background: linear-gradient(135deg, var(--accent-2), var(--accent));
            box-shadow: 0 12px 30px rgba(242,180,90,.28);
            transition: transform .15s, box-shadow .15s, opacity .2s;
        }
        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 16px 36px rgba(242,180,90,.4); }
        .btn-submit:disabled { opacity: .7; transform: none; cursor: default; }
        #formMessage { min-height: 26px; margin-top: 14px; text-align: center; font-weight: 700; }
        .ok { color: #7ee2a8; } .err { color: #ff9a9a; }

        /* الشاشات الصغيرة: تعتيم الصورة ووضع النموذج في العرض الكامل */
        @media (max-width: 900px) {
            body::before { background-position: center; }
            body::after { background: linear-gradient(rgba(20,20,20,.6), rgba(20,20,20,.88)); }
            .page { align-items: flex-start; justify-content: center; padding-top: 28px; }
            .panel { width: 100%; max-width: 560px; }
        }
    </style>
</head>
<body>
    <main class="page">
        <section class="panel">
            <div class="eyebrow">استبيان الأمانة الاجتماعية</div>
            <h1>الأمانة الاجتماعية</h1>
            <p class="lead">
                شاركونا آراءكم؛ نسعى لأن نجعل مجتمعنا في الدفعة أفضل، ونريد أن نسمع منكم: ما أبرز المشكلات والعادات التي واجهتموها وترون أنها تستحق أن نتحدث عنها ونبحث معاً عن طريقة للتعامل معها؟
            </p>

            <form id="shareForm" novalidate>
                <input type="checkbox" name="botcheck" id="botcheck" style="display:none" tabindex="-1" autocomplete="off">

                <label class="q" for="opinion">مشاركتك</label>
                <textarea id="opinion"
                    placeholder="اكتب رأيك بحرية: ما العادة أو التصرف الذي ترى أنه يحتاج إلى نقاش؟ وكيف تقترح أن نتعامل معه؟"></textarea>

                <div class="field2">
                    <label class="q" for="ideas">ما هي اقتراحاتكم لما يمكننا الحديث عنه مستقبلاً، وما تودون أن نقدمه؟</label>
                    <textarea id="ideas" placeholder="اكتب اقتراحاتك وأفكارك هنا"></textarea>
                </div>

                <div class="name-box" style="margin-top:20px">
                    <label class="switch-row" for="showName">
                        <input type="checkbox" id="showName">
                        <span class="track"></span>
                        <span class="switch-text">
                            <b>أرغب بإظهار اسمي</b>
                            <small>إن تركته مغلقاً ستصلنا مشاركتك دون أي اسم.</small>
                        </span>
                    </label>
                    <div class="name-field" id="nameField">
                        <input type="text" id="name" placeholder="اكتب اسمك" autocomplete="off">
                    </div>
                </div>

                <button type="submit" class="btn-submit" id="submitBtn">إرسال مشاركتي</button>
                <div id="formMessage" role="alert"></div>
            </form>
            <div class="sign">الأمانة الاجتماعية</div>
        </section>
    </main>

    <script>
        const ACCESS_KEY = 'f27f6c47-4cd9-40a7-85f5-4b6519147642';

        const form = document.getElementById('shareForm');
        const btn = document.getElementById('submitBtn');
        const msg = document.getElementById('formMessage');
        const opinion = document.getElementById('opinion');
        const ideas = document.getElementById('ideas');
        const showName = document.getElementById('showName');
        const nameField = document.getElementById('nameField');
        const nameInput = document.getElementById('name');

        showName.addEventListener('change', () => {
            nameField.classList.toggle('open', showName.checked);
            if (showName.checked) setTimeout(() => nameInput.focus(), 250);
            else nameInput.value = '';
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            msg.className = ''; msg.textContent = '';

            const text = opinion.value.trim();
            const ideasText = ideas.value.trim();
            if (!text && !ideasText) {
                msg.className = 'err'; msg.textContent = 'اكتب مشاركتك أو اقتراحاتك أولاً';
                opinion.focus(); return;
            }
            if (showName.checked && !nameInput.value.trim()) {
                msg.className = 'err'; msg.textContent = 'اكتب اسمك أو أغلق خيار إظهار الاسم';
                nameInput.focus(); return;
            }

            btn.disabled = true; btn.textContent = 'جاري الإرسال...';

            const payload = {
                access_key: ACCESS_KEY,
                subject: 'مشاركة جديدة - الأمانة الاجتماعية',
                from_name: 'استبيان الأمانة الاجتماعية',
                botcheck: document.getElementById('botcheck').checked
            };
            if (text) payload['المشاركة'] = text;
            if (ideasText) payload['الاقتراحات'] = ideasText;
            // الاسم يُرسل فقط إذا اختار الطالب إظهاره
            if (showName.checked) payload['الاسم'] = nameInput.value.trim();

            const ctrl = new AbortController();
            const timer = setTimeout(() => ctrl.abort(), 20000);
            try {
                const res = await fetch('https://api.web3forms.com/submit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                    body: JSON.stringify(payload),
                    signal: ctrl.signal
                });
                const data = await res.json();
                if (res.ok && data.success) {
                    msg.className = 'ok';
                    msg.textContent = '✅ وصلتنا مشاركتك، شكراً لك';
                    form.reset();
                    nameField.classList.remove('open');
                } else {
                    throw new Error(data.message || 'error');
                }
            } catch (err) {
                msg.className = 'err';
                msg.textContent = '❌ تعذّر الإرسال، حاول مرة أخرى';
            } finally {
                clearTimeout(timer);
                btn.disabled = false; btn.textContent = 'إرسال مشاركتي';
            }
        });
    </script>
</body>
</html>
