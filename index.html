<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الدفعة الهندسية</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: url('https://images.unsplash.com/photo-1581094288338-2314dddb7eed') no-repeat center center fixed;
            background-size: cover;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .header-bg {
            background: rgba(30, 60, 114, 0.85);
            color: white;
            padding: 30px 0;
            border-bottom-left-radius: 30px;
            border-bottom-right-radius: 30px;
            backdrop-filter: blur(5px);
            margin-bottom: 20px;
        }
        .term-card {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            backdrop-filter: blur(10px);
            border-top: 6px solid #2a5298;
        }
        .material-item {
            background: #f8f9fa;
            border-right: 5px solid #28a745;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .btn-download {
            background-color: #28a745;
            color: white;
            border-radius: 20px;
            padding: 5px 15px;
            text-decoration: none;
            font-size: 0.85rem;
        }
        .btn-download:hover { color: white; background-color: #218838; }
        .form-card { border-top-color: #28a745; }
        .btn-submit {
            background-color: #2a5298;
            color: white;
            border-radius: 20px;
            padding: 10px 30px;
            border: none;
        }
        .btn-submit:hover { background-color: #1e3c72; color: white; }
        .btn-submit:disabled { opacity: .7; }
    </style>
</head>
<body>

    <div class="header-bg text-center">
        <h1>منصة الدفعة الهندسية</h1>
        <p>المكتبة الرقمية للمواد الدراسية</p>
    </div>

    <div class="container">

        <!-- المواد الدراسية -->
        <div class="term-card">
            <h3 class="text-center mb-3">📚 مواد الفصل الدراسي</h3>

            <div class="material-item">
                <span>حسبان ٢</span>
                <a href="#" class="btn btn-download">تحميل PDF</a>
            </div>
            <div class="material-item">
                <span>هندسة تحليلية</span>
                <a href="#" class="btn btn-download">تحميل PDF</a>
            </div>
            <div class="material-item">
                <span>رسم هندسي</span>
                <a href="https://drive.google.com/file/d/1vFjc7mi58WZ87jOjy3IQR7Ai4c5V0EsT/view?usp=drivesdk" target="_blank" rel="noopener" class="btn btn-download">تحميل PDF</a>
            </div>
            <div class="material-item">
                <span>فيزياء</span>
                <a href="#" class="btn btn-download">تحميل PDF</a>
            </div>
            <div class="material-item">
                <span>أساسيات الورش</span>
                <a href="#" class="btn btn-download">تحميل PDF</a>
            </div>
        </div>

        <!-- نموذج الترشح -->
        <div class="term-card form-card">
            <h3 class="text-center mb-3">📝 نموذج الترشح</h3>

            <form id="candidateForm">
                <!-- حقل مخفي لمنع الرسائل المزعجة -->
                <input type="text" name="_honey" style="display:none" tabindex="-1" autocomplete="off">
                <input type="hidden" name="_subject" value="طلب ترشح جديد - منصة الدفعة الهندسية">
                <input type="hidden" name="_captcha" value="false">
                <input type="hidden" name="_template" value="table">

                <div class="mb-3">
                    <label for="name" class="form-label">الاسم</label>
                    <input type="text" class="form-control" id="name" name="الاسم" required placeholder="اكتب اسمك الكامل">
                </div>

                <div class="mb-3">
                    <label for="position" class="form-label">الأمانة التي تريد الترشح لها</label>
                    <input type="text" class="form-control" id="position" name="الأمانة" required placeholder="مثال: الأمانة العلمية">
                </div>

                <div class="mb-3">
                    <label for="whatsapp" class="form-label">رقم الواتساب</label>
                    <input type="tel" class="form-control" id="whatsapp" name="رقم الواتساب" required dir="ltr" placeholder="+249XXXXXXXXX">
                </div>

                <div class="mb-3">
                    <label for="notes" class="form-label">ملاحظة</label>
                    <textarea class="form-control" id="notes" name="ملاحظة" rows="3" placeholder="أي ملاحظة تريد إضافتها (اختياري)"></textarea>
                </div>

                <div class="text-center">
                    <button type="submit" class="btn btn-submit" id="submitBtn">إرسال</button>
                </div>

                <div id="formMessage" class="mt-3 text-center" role="alert"></div>
            </form>
        </div>
    </div>

    <footer class="text-center text-white mt-4">
        <p>صُنع بكل فخر للدفعة الهندسية © 2026</p>
    </footer>

    <script>
        const form = document.getElementById('candidateForm');
        const btn = document.getElementById('submitBtn');
        const msg = document.getElementById('formMessage');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            btn.disabled = true;
            btn.textContent = 'جاري الإرسال...';
            msg.className = 'mt-3 text-center';
            msg.textContent = '';

            try {
                const res = await fetch('https://formsubmit.co/ajax/wademammohammed@gmail.com', {
                    method: 'POST',
                    headers: { 'Accept': 'application/json' },
                    body: new FormData(form)
                });
                const data = await res.json();

                if (res.ok && (data.success === true || data.success === 'true')) {
                    msg.className = 'mt-3 text-center text-success fw-bold';
                    msg.textContent = '✅ تم إرسال طلبك بنجاح';
                    form.reset();
                } else {
                    throw new Error(data.message || 'خطأ');
                }
            } catch (err) {
                msg.className = 'mt-3 text-center text-danger fw-bold';
                msg.textContent = '❌ تعذّر الإرسال، حاول مرة أخرى';
            } finally {
                btn.disabled = false;
                btn.textContent = 'إرسال';
            }
        });
    </script>
</body>
</html>
